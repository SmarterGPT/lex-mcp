name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  delivery-contract:
    name: Delivery Contract
    runs-on: ubuntu-24.04
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2
        with:
          egress-policy: audit
          disable-sudo: true

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v7
        with:
          node-version: "24.14.1"
          cache: npm

      - name: Pin candidate npm
        run: npm install --global npm@11.12.1

      - name: Install exact public dependency graph
        run: npm ci --ignore-scripts

      - name: Verify bundled native SQLite without rebuilding
        run: npm run test:native

      - name: Reject known high-severity dependency findings
        run: npm audit --audit-level=high

      - name: Run delivery-contract tests
        run: npm test

      - name: Run packed public-dependency smoke test
        run: npm run test:pack
        env:
          LEX_MCP_USE_PUBLIC_LEX: "1"

      - name: Verify packed consumer with lifecycle scripts disabled
        run: npm run test:pack -- --ignore-scripts
        env:
          LEX_MCP_USE_PUBLIC_LEX: "1"

      - name: Verify package contents
        run: npm pack --ignore-scripts --dry-run
